# .github/workflows/basic-pipeline.yml

name: Basic Pipeline Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-python-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run python.py
        run: python python.py
